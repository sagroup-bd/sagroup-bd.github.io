<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.A. Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE3;
  --bg-2:#EAE3D2;
  --ink:#1E2A20;
  --ink-soft:#4B5A4E;
  --green:#2F4A34;
  --green-dark:#1B2A20;
  --sand:#B9986A;
  --sand-dark:#8A6C43;
  --rust:#AC5330;
  --card:#FFFFFF;
  --line:rgba(30,42,32,0.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C17; --bg-2:#1D241E; --ink:#EDE9DD; --ink-soft:#B9C2BB;
    --card:#20281F; --line:rgba(237,233,221,0.14);
  }
}
:root[data-theme="dark"]{
  --bg:#161C17; --bg-2:#1D241E; --ink:#EDE9DD; --ink-soft:#B9C2BB;
  --card:#20281F; --line:rgba(237,233,221,0.14);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
*{margin:0; padding:0; box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Hind Siliguri', 'Noto Sans Arabic', system-ui, sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{line-height:1.9;}
.display{font-family:'Fraunces', 'Hind Siliguri', serif;}
img,svg{max-width:100%; display:block;}
.wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
a{color:inherit;}

/* header */
header{
  position:sticky; top:0; padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); z-index:50;
}
.nav{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 24px; max-width:1080px; margin:0 auto;}
.wordmark{font-family:'Fraunces',serif; font-weight:600; font-size:1.25rem; letter-spacing:0.01em; text-decoration:none; flex-shrink:0;}
.wordmark span{color:var(--rust);}
.nav-right{display:flex; align-items:center; gap:16px;}
nav.links{display:flex; gap:28px; font-size:0.95rem;}
nav.links a{text-decoration:none; color:var(--ink-soft); transition:color .15s;}
nav.links a:hover{color:var(--ink);}
.menu-btn{display:none; background:none; border:none; color:var(--ink); font-size:1.5rem; cursor:pointer;}
.lang-switch{display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; flex-shrink:0;}
.lang-btn{background:none; border:none; padding:6px 12px; font-size:0.82rem; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:inherit;}
.lang-btn.active{background:var(--green); color:#F3EFE3;}
@media (max-width:720px){
  nav.links{position:absolute; top:100%; left:0; right:0; background:var(--bg); flex-direction:column; gap:0; border-bottom:1px solid var(--line); display:none;}
  nav.links.open{display:flex;}
  nav.links a{padding:14px 24px; border-top:1px solid var(--line);}
  .menu-btn{display:block;}
}

/* hero */
.hero{padding:72px 0 64px; position:relative; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr;}}
.eyebrow{color:var(--sand-dark); font-size:0.95rem; margin-bottom:14px;}
h1{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.1rem,5vw,3.4rem); line-height:1.12; letter-spacing:-0.01em;}
html[dir="rtl"] h1{font-family:'Noto Sans Arabic','Fraunces',serif; letter-spacing:0;}
.hero p.lede{margin-top:20px; font-size:1.1rem; color:var(--ink-soft); max-width:44ch;}
.cta-row{margin-top:32px; display:flex; gap:14px; flex-wrap:wrap;}
.btn{display:inline-block; padding:13px 26px; border-radius:3px; text-decoration:none; font-weight:600; font-size:0.98rem;}
.btn-primary{background:var(--green); color:#F3EFE3;}
.btn-outline{border:1px solid var(--line); color:var(--ink);}

.texture{aspect-ratio:1/1; border-radius:6px; position:relative; overflow:hidden; display:grid; grid-template-rows:1fr 1fr;}
.tex-green, .tex-sand{position:relative; background-size:cover; background-position:center;}
.tex-green::before, .tex-sand::before{content:''; position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.05) 55%);}
.tex-label{position:absolute; bottom:16px; left:18px; color:#F3EFE3; font-family:'Fraunces',serif; font-size:0.95rem;}
html[dir="rtl"] .tex-label{left:auto; right:18px;}

/* sections */
section{padding:64px 0;}
.section-head{max-width:56ch; margin-bottom:36px;}
.section-head .kicker{color:var(--sand-dark); font-size:0.9rem; margin-bottom:8px;}
h2{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(1.6rem,3.4vw,2.2rem);}
html[dir="rtl"] h2{font-family:'Noto Sans Arabic','Fraunces',serif;}
.about-body p{color:var(--ink-soft); max-width:64ch; margin-top:14px;}
.about-grid{display:grid; grid-template-columns:auto 1fr; gap:36px; align-items:start;}
@media (max-width:640px){.about-grid{grid-template-columns:1fr; justify-items:center; text-align:center;}}
.about-photo{width:148px; height:148px; border-radius:50%; object-fit:cover; border:3px solid var(--sand); flex-shrink:0;}
.about-name{font-family:'Fraunces',serif; font-weight:600; font-size:1.1rem; margin-top:18px;}
html[dir="rtl"] .about-name{font-family:'Noto Sans Arabic','Fraunces',serif;}
.about-title{color:var(--sand-dark); font-size:0.92rem; margin-top:2px;}

.divisions{display:grid; gap:28px;}
.division{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  overflow:hidden;
}
.div-banner{width:100%; line-height:0;}
.div-banner svg, .div-banner img{width:100%; height:160px; object-fit:cover; display:block;}
.div-body{padding:36px; display:grid; grid-template-columns:auto 1fr; gap:28px;}
@media (max-width:720px){.div-body{grid-template-columns:1fr;} .div-banner svg, .div-banner img{height:120px;}}
.div-mark{width:56px; height:56px; border-radius:4px; flex-shrink:0;}
.div-mark.g{background:var(--green);}
.div-mark.s{background:linear-gradient(135deg,var(--sand),var(--sand-dark));}
.division h3{font-family:'Fraunces',serif; font-weight:600; font-size:1.35rem;}
html[dir="rtl"] .division h3{font-family:'Noto Sans Arabic','Fraunces',serif;}
.division .slogan{color:var(--sand-dark); font-style:italic; margin-top:4px; font-size:0.98rem;}
html[dir="rtl"] .division .slogan{font-style:normal;}
.division .div-desc{color:var(--ink-soft); font-size:0.95rem; margin-top:14px; max-width:60ch;}
.division .meta{margin-top:16px; color:var(--ink-soft); font-size:0.95rem;}
.division .meta div{margin-top:4px;}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
.tag{border:1px solid var(--line); border-radius:20px; padding:5px 14px; font-size:0.85rem; color:var(--ink-soft);}
.map-link{display:inline-block; margin-top:20px; font-size:0.92rem; font-weight:600; color:var(--green); text-decoration:none; border-bottom:1px solid var(--sand); padding-bottom:2px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map-link{color:var(--sand);}}
:root[data-theme="dark"] .map-link{color:var(--sand);}

.contact{background:var(--green-dark); color:#F3EFE3;}
.contact h2{color:#F3EFE3;}
.contact .section-head .kicker{color:var(--sand);}
.contact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; margin-top:8px;}
.contact-card{border:1px solid rgba(243,239,227,0.18); border-radius:6px; padding:24px;}
.contact-card h4{font-family:'Fraunces',serif; font-weight:600; margin-bottom:10px;}
html[dir="rtl"] .contact-card h4{font-family:'Noto Sans Arabic','Fraunces',serif;}
.contact-card div{color:rgba(243,239,227,0.78); font-size:0.95rem; margin-top:4px;}
.contact-card a{text-decoration:none; color:inherit;}

footer{padding:32px 0; text-align:center; color:var(--ink-soft); font-size:0.9rem; border-top:1px solid var(--line);}

/* product grid */
.product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; margin-top:18px;}
.product-card{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:14px 8px; text-align:center;}
.p-icon{font-size:1.5rem; line-height:1;}
.product-card span:last-child{font-size:0.8rem; color:var(--ink-soft);}

/* quote form */
.quote-form{display:grid; gap:16px; max-width:520px; margin-top:8px;}
.qf-row{display:flex; flex-direction:column; gap:6px;}
.qf-row label{font-size:0.9rem; color:var(--ink-soft); font-weight:600;}
.qf-row input, .qf-row select{padding:11px 14px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); font-family:inherit; font-size:0.95rem;}
.quote{background:var(--bg-2);}

/* floating actions */
.float-actions{position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:12px; z-index:90;}
html[dir="rtl"] .float-actions{right:auto; left:24px;}
.float-actions{bottom:calc(24px + env(safe-area-inset-bottom,0px));}
.float-btn{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.25); text-decoration:none;}
.float-btn svg{width:24px; height:24px;}
.float-call{background:var(--green); color:#fff;}
.float-wa{background:#25D366; color:#fff;}

.proprietor-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
.avatar-circle{width:34px; height:34px; border-radius:50%; background:var(--bg-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.avatar-circle svg{width:19px; height:19px;}
.proprietor-info{display:flex; flex-direction:column;}
.proprietor-info .p-name{font-weight:600; font-size:0.92rem;}
.proprietor-info .p-phone{font-size:0.85rem; color:var(--ink-soft); text-decoration:none;}
.contact-card .proprietor-row{margin-top:8px;}
.contact-card .avatar-circle{background:rgba(243,239,227,0.1); border-color:rgba(243,239,227,0.18);}
.contact-card .p-name{color:#F3EFE3;}
.contact-card .p-phone{color:rgba(243,239,227,0.78);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="#top" class="wordmark">S.A. <span>Group</span></a>
    <div class="nav-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="bn">বাং</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ar">عربي</button>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <nav class="links" id="navLinks">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#sand" data-i18n="nav_sand"></a>
      <a href="#poultry" data-i18n="nav_poultry"></a>
      <a href="#quote" data-i18n="nav_quote"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
  </div>
</header>

function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  var dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[key] != null){ el.textContent = dict[key]; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
    var key = el.getAttribute('data-i18n-placeholder');
    if(dict[key] != null){ el.placeholder = dict[key]; }
  });
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  try{ localStorage.setItem('sa-group-lang', lang); }catch(e){}
}

document.querySelectorAll('.lang-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ setLang(btn.dataset.lang); });
});

var initialLang = 'bn';
try{
  var saved = localStorage.getItem('sa-group-lang');
  if(saved && translations[saved]) initialLang = saved;
}catch(e){}
setLang(initialLang);

document.getElementById('menuBtn').addEventListener('click', function(){
  document.getElementById('navLinks').classList.toggle('open');
});
document.querySelectorAll('nav.links a').forEach(function(a){
  a.addEventListener('click', function(){ document.getElementById('navLinks').classList.remove('open'); });
});

document.getElementById('quoteForm').addEventListener('submit', function(e){
  e.preventDefault();
  var dict = translations[document.documentElement.lang] || translations.bn;
  var businessSel = document.getElementById('qf_business');
  var businessLabel = businessSel.options[businessSel.selectedIndex].textContent;
  var product = document.getElementById('qf_product').value;
  var qty = document.getElementById('qf_qty').value;
  var name = document.getElementById('qf_name').value;
  var phone = document.getElementById('qf_phone').value;
  var msg = dict.quote_msg
    .replace('{business}', businessLabel)
    .replace('{product}', product)
    .replace('{qty}', qty)
    .replace('{name}', name)
    .replace('{phone}', phone);
  window.open('https://wa.me/8801608007244?text=' + encodeURIComponent(msg), '_blank');
});
